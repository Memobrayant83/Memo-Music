<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memo Music</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
  text-align: center;
}

header {
  padding: 30px 20px;
  background: linear-gradient(135deg,#151b36,#27194b);
}

h1 {
  margin: 0;
  font-size: 36px;
}

.subtitle {
  color: #b9c0d4;
}

.genres {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 15px;
  padding: 20px;
}

.genre {
  background: #171d33;
  padding: 20px;
  border-radius: 18px;
  font-size: 18px;
  cursor: pointer;
}

.genre:active {
  transform: scale(.97);
}

.player {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #11172b;
  padding: 15px;
  border-top: 1px solid #333a55;
}

#station-name {
  font-weight: bold;
  margin-bottom: 10px;
}

audio {
  width: 100%;
}
</style>
</head>

<body>

<header>
<h1>🎧 Memo Music</h1>
<p class="subtitle">Pick a genre and start listening</p>
</header>





























  











  


</div>

<div class="player">
<div id="station-name">Choose a genre</div>
<audio id="audio" controls></audio>
</div>

<script>

async function playGenre(genre) {

const stationName =
document.getElementById("station-name");

const audio =
document.getElementById("audio");

stationName.textContent =
"Finding " + genre + " station...";

try {

const url =
"https://de1.api.radio-browser.info/json/stations/search?tag=" +
encodeURIComponent(genre) +
"&hidebroken=true&limit=30&order=random";

const response =
await fetch(url);

const stations =
await response.json();

const usable =
stations.filter(station =>
station.url_resolved &&
station.url_resolved.startsWith("https://")
);

if (usable.length === 0) {
stationName.textContent =
"No station found.";
return;
}

const station =
usable[Math.floor(
Math.random() * usable.length
)];

stationName.textContent =
"▶ " + station.name;

audio.src =
station.url_resolved;

audio.play();

} catch (error) {

stationName.textContent =
"Station failed to load.";

}

}

</script>

</body>
</html>
